services:
  nginx:
    image: nginx:stable-alpine3.21-perl
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - './nginx.conf:/etc/nginx/nginx.conf'
      - '/etc/letsencrypt:/etc/letsencrypt'
      - '/root/app/uploads:/var/www/uploads:ro'
    depends_on:
      - backend
      - frontend
    networks:
      - network

  backend:
    build:
      context: ./api
    restart: unless-stopped
    # DNS hands out Telegram addresses that are blackholed from this host;
    # 149.154.167.220 is the one that stays reachable. TLS still validates
    # against the hostname, so pinning the address changes nothing else.
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    expose:
      - "8000"
    volumes:
      - /root/app:/app/data
    networks:
      - network

  frontend:
    build:
      context: ./app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /root/app/images:/usr/share/nginx/html/images
    networks:
      - network

networks:
  network: